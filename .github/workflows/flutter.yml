name: Flutter and relay checks

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: cd relay && npm install
      - run: cd relay && npm start > /tmp/vibe-relay.log 2>&1 &
      - run: cd relay && npm run test:two-clients
